<!DOCTYPE html>
<html>

<body>
    <div id="rooms-section" class="section">
        <ul id="rooms"></ul>
        <form id="create-room">
            <label for="name">Room name:</label>
            <input type="text" id="name" name="name">
            <label for="password">Room password:</label>
            <input type="text" id="password" name="password">
            <input type="submit" value="Create room">
        </form>
    </div>
    <div id="lobby-section" class="section">
        <p>Waiting for round to start...</p>
        <button class="start-round">Start round</button>
        <button class="leave-room">Leave room</button>
    </div>
    <div id="game-section" class="section">
        <p id="opponent-status">Waiting for opponent's move..</p>
        <p>Pick your move</p>
        <button id="rock" class="play-move">Rock</button>
        <button id="paper" class="play-move">Paper</button>
        <button id="scissors" class="play-move">Scissors</button>
        <button class="leave-room">Leave room</button>
    </div>
    <div id="result-section" class="section">
        <p id="game-result"></p>
        <p>Waiting for round to start...</p>
        <button class="start-round">Start round</button>
        <button class="leave-room">Leave room</button>
    </div>
    <p id="ids"></p>
    <script>
        setInterval(() => {
            document.querySelector('p#ids').innerHTML = `room: ${sessionStorage.getItem('room')?.slice(0, 4)}, user: ${sessionStorage.getItem('user')?.slice(0, 4)}`
        }, 100)
    </script>
    <script src="./main.js" type="module"></script>
</body>

</html>
